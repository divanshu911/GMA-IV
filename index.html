<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StreetBound</title>
  <link rel="stylesheet" href="./style.css">
</head>
  
  
<body>

  <div id="gameContainer">
    <!-- PLAYER PHONE -->
<div id="playerPhone" aria-hidden="true">
    <div id="phoneSideButtonTop"></div>
    <div id="phoneSideButtonMiddle"></div>
    <div id="phoneSideButtonBottom"></div>

    <div id="phoneFrame">
    <div id="phoneFrontCamera"></div>

    <div id="phoneScreen">

        <!-- PHONE HOME -->
        <div id="phoneHomeScreen">

            <div class="phone-status-bar">
                <span>StreetBound</span>
                <span>15:42</span>
            </div>

            <div class="phone-app-grid">

                <button
                    id="ambulancePhoneApp"
                    class="phone-app"
                    type="button"
                >
                    <span class="phone-app-icon">🚑</span>
                    <span class="phone-app-name">Ambulance</span>
                </button>

            </div>

        </div>

        <!-- AMBULANCE CALL SCREEN -->
        <div
            id="phoneCallScreen"
            style="display:none;"
        >
            <button
                id="phoneBackButton"
                type="button"
            >
                ← Back
            </button>

            <div class="phone-call-content">
                <div class="phone-call-icon">🚑</div>

                <div class="phone-call-name">
                    Ambulance
                </div>

                <div
                    id="phoneCallStatus"
                    class="phone-call-status"
                >
                    Calling ambulance...
                </div>
            </div>
        </div>

    </div>

    <div id="phoneHomeButton"></div>
    </div>
</div>
    <div id="rotateMessageOverlay">ROTATE DEVICE TO PLAY!                 
  </div>
    <div id="startScreen">
      <h1>StreetBound</h1>
      <div class="menu-box">
        <button id="startButton">START GAME</button>
      </div>
    </div>
    <div id="desktopControlsModal">
  <div id="desktopControlsBox">
    <h2>DESKTOP CONTROLS</h2>

    <div class="control-row">
      <span>W / A / S / D</span>
      <span>Move</span>
    </div>

    <div class="control-row">
      <span>ARROW KEYS</span>
      <span>Move</span>
    </div>

    <div class="control-row">
      <span>E</span>
      <span>Enter / Exit Vehicle</span>
    </div>

    <div class="control-row">
      <span>F</span>
      <span>Interact</span>
    </div>

    <div class="control-row">
      <span>H</span>
      <span>Open / Close Map</span>
    </div>

    <div class="control-row">
    <span>P</span>
    <span>Open / Close Phone</span>
    </div>

    <div class="control-row">
      <span>L</span>
      <span>Tow Truck</span>
    </div>

    <div class="control-row">
      <span>G</span>
      <span>Police Siren</span>
    </div>

    <div class="desktop-controls-close">
      Press SPACE to close
    </div>
  </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="joystickZone">
      <div
         id="joystickBase">
        <div id="joystickKnob"></div>
      </div>
    </div> <button id="jackBtn">🚘</button>
     <button id="taxiBtn" class="interact-btn">🚕</button>
    <button id="restaurantBtn" class="interact-btn">🍔</button>    <button id="enterHomeBtn" class="interact-btn">🏠</button>
    <button id="sleepBtn" class="interact-btn">🛌</button>
    <button id="exitHomeBtn" class="interact-btn">🚪</button>
  </div>
      <button id="blackMarketBtn" class="interact-btn">💸</button>
    <button id="truckBtn" class="interact-btn">🚚</button>
  </div>

  <div id="exitBtn">👟</div>
  <!-- Dealership Action Buttons -->
<button id="enterDealerBtn" style="display:none; position:absolute; bottom:20%; left:50%; transform:translateX(-50%); z-index:100; padding:10px; font-weight:bold;">ENTER DEALERSHIP</button>
<button id="exitDealerBtn" style="display:none; position:absolute; bottom:15%; left:50%; transform:translateX(-50%); z-index:100; padding:10px; font-weight:bold;">EXIT DEALERSHIP</button>

<!-- Dealership Buying Panel -->
<div id="dealershipPanel" style="display:none; position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); background:rgba(0,0,0,0.85); color:#fff; padding:20px; border:2px solid #00bcd4; z-index:200; text-align:center; border-radius:10px;">
    <h2 id="carPanelName" style="margin-top:0;">Car Name</h2>
    <h3 id="carPanelPrice" style="color:#2ecc71;">$0</h3>
    <p id="carPanelStats" style="font-size:14px; color:#ccc;"></p>
    
    <label for="carColorPicker">Paint Color:</label>
    <input type="color" id="carColorPicker" value="#ffffff" style="margin-bottom:15px; cursor:pointer;"><br>

    <button id="buyCarBtn" style="padding:10px 20px; background:#2ecc71; color:black; font-weight:bold; cursor:pointer;">BUY</button>
    <button id="closePanelBtn" style="padding:10px 20px; background:#e74c3c; color:white; font-weight:bold; cursor:pointer; margin-left:10px;">CANCEL</button>
</div>
  

  <script src="important.js"></script><script src="gameplay.js"></script>
<script src="main.js"></script>
  <script src="entities.js"></script>
  
  
</body>
</html>
